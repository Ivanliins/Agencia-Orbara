<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Onest;src:url(onest-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Onest;src:url(onest-latin-ext-wght-normal.woff2) format("woff2");font-weight:100 900;unicode-range:U+0100-024F}
*{margin:0;box-sizing:border-box}body{font-family:Onest;background:#0d0101;color:#fffafa}
.o{color:#ff5d00;font-style:italic}
.frame{position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 40%,#3a1404 0%,#160603 45%,#0d0101 75%)}
.ring{position:absolute;border:2px solid rgba(255,93,0,.22);border-radius:50%}
.logo{display:flex;align-items:center;gap:.35em;font-weight:900;letter-spacing:.18em}
.chip{display:inline-block;background:#ff5d00;color:#0d0101;font-weight:900;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<!-- BANNER 2560x1440, área segura 1546x423 centralizada -->
<div id="banner" class="frame" style="width:2560px;height:1440px">
  <div class="ring" style="width:1500px;height:1500px;left:1450px;top:-200px"></div>
  <div class="ring" style="width:1000px;height:1000px;left:1700px;top:50px"></div>
  <div class="ring" style="width:2400px;height:900px;left:-300px;top:420px;transform:rotate(-8deg);border-style:dashed;border-color:rgba(255,93,0,.12)"></div>
  <div style="position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:30px;letter-spacing:.35em;color:#ff5d00;font-weight:800;margin-bottom:22px">SITES · SEO · GOOGLE ADS · MOTION</div>
      <div style="font-size:112px;font-weight:900;line-height:.95;letter-spacing:-.03em">Sites que fazem<br><span class="o">barulho.</span></div>
    </div>
    <div style="text-align:right">
      <div class="logo" style="font-size:64px;justify-content:flex-end">LOGO</div>
      <div style="font-size:30px;margin-top:22px;opacity:.75">orbara.com.br</div>
      <div class="chip" style="font-size:24px;padding:14px 28px;margin-top:22px">Diagnóstico grátis</div>
    </div>
  </div>
</div>
<!-- PERFIL 800x800 -->
<div id="avatar" class="frame" style="width:800px;height:800px;display:flex;align-items:center;justify-content:center;background:#0d0101">
  <svg width="520" height="520" viewBox="-4 -4 32 32" fill="none"><circle cx="12" cy="12" r="10.5" stroke="#fffafa" stroke-width="1.5"/><circle cx="19.5" cy="4.5" r="3" fill="#ff5d00"/><circle cx="19.5" cy="4.5" r="1.5" fill="#ffaa60"/></svg>
</div>
<!-- MARCA D'ÁGUA 150x150 -->
<div id="watermark" style="width:150px;height:150px;display:flex;align-items:center;justify-content:center;background:transparent">
  <svg width="130" height="130" viewBox="-4 -4 32 32" fill="none"><circle cx="12" cy="12" r="10.5" stroke="#fffafa" stroke-width="2"/><circle cx="19.5" cy="4.5" r="3" fill="#ff5d00"/></svg>
</div>
<!-- MINIATURAS 1280x720 -->
<div id="thumb-gads" class="frame" style="width:1280px;height:720px">
  <img src="../assets/frames/gads-10.jpg" style="position:absolute;left:330px;top:0;width:1280px;height:720px;object-fit:cover;opacity:.9">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#0d0101 38%,rgba(13,1,1,.6) 55%,transparent 80%)"></div>
  <div style="position:absolute;left:70px;top:70px" class="logo" data-size="34">LOGO</div>
  <div style="position:absolute;left:70px;top:190px;font-size:104px;font-weight:900;line-height:.95;letter-spacing:-.03em">Seu cliente<br>está no<br><span class="o">Google.</span></div>
  <div class="chip" style="position:absolute;left:70px;bottom:70px;font-size:30px;padding:16px 30px">E você não aparece?</div>
</div>
<div id="thumb-impacto" class="frame" style="width:1280px;height:720px">
  <img src="../assets/frames/impacto-22.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#0d0101 28%,rgba(13,1,1,.2) 80%)"></div>
  <div style="position:absolute;left:70px;top:70px" class="logo" data-size="34">LOGO</div>
  <div style="position:absolute;left:70px;top:200px;font-size:110px;font-weight:900;line-height:.95;letter-spacing:-.03em">Um site que<br>faz <span class="o">barulho.</span></div>
  <div class="chip" style="position:absolute;left:70px;bottom:70px;font-size:30px;padding:16px 30px">Filme de marca · 30s</div>
</div>
<script>
const mk=(s,stroke="#fffafa")=>`<svg width="${s}" height="${s}" viewBox="-4 -4 32 32" fill="none" style="overflow:visible"><circle cx="12" cy="12" r="10.5" stroke="${stroke}" stroke-width="1.6"/><circle cx="19.5" cy="4.5" r="3" fill="#ff5d00"/><circle cx="19.5" cy="4.5" r="1.5" fill="#ffaa60"/></svg>`;
document.querySelectorAll(".logo").forEach(e=>{const fs=+e.dataset.size||parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=fs+"px";e.innerHTML=mk(fs*1.25)+"<span>ORBARA</span>"});
</script></body></html>
